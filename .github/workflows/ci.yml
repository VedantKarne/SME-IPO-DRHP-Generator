name: CI

# There was no CI at all before this. The suite is what stops the classes of
# defect this project has repeatedly hit — silent mock fallbacks, unauthenticated
# endpoints, nondeterministic ordering — from coming back unnoticed.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        # The full requirements.txt pulls BGE-M3, docling and torch, which are
        # far too heavy for CI and are exercised by the local end-to-end run
        # instead. These are what the offline tests need.
        run: |
          python -m pip install --upgrade pip
          pip install pytest fastapi "uvicorn[standard]" sqlalchemy pydantic \
                      python-jose[cryptography] bcrypt python-docx reportlab \
                      python-dotenv httpx

      - name: Offline test suite
        env:
          # auth_router raises without this; conftest also sets a throwaway value.
          JWT_SECRET_KEY: ci-only-not-a-real-secret
        run: |
          pytest tests/Phase_tests/test_phase_2_chunking.py \
                 tests/Phase_tests/test_phase_7_eligibility.py \
                 tests/Phase_tests/test_phase_8_gap_detector.py \
                 tests/Phase_tests/test_phase_18_export_conformance.py \
                 -q --tb=short

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint (errors only)
        run: npx oxlint src/ --deny-warnings=false
      - name: Build
        run: npm run build

      - name: No fabricated data in the canvas
        # Guards the P0 invariant: the Canvas must never ship mock banks that
        # present canned content as real model output.
        run: |
          if grep -rn "_BANK\|mock-id\|MOCK" src/canvas/ --include="*.js" --include="*.jsx" \
             | grep -v "^\s*//" | grep -v "mock-response layer" | grep -v "not mock data" \
             | grep -v "mock or" | grep -v "mock bank"; then
            echo "::error::Mock data found in src/canvas — see the P0 commit for why this is banned."
            exit 1
          fi
